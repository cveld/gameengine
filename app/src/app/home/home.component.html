<div class="container py-5">

      <a routerLink="/engine" class="text-decoration-none text-dark">
        <div class="card h-100 shadow-sm tile">
          <div class="card-body text-center py-5">
            <i class="bi bi-suit-spade-fill" style="font-size: 3rem;"></i>
            <h2 class="card-title mt-3">Kaartspel-engine</h2>

    </div>
    <div class="col-md-6">
      <a routerLink="/memory" class="text-decoration-none text-dark">
        <div class="card h-100 shadow-sm tile">
          <div class="card-body text-center py-5">
            <i class="bi bi-grid-3x3-gap-fill" style="font-size: 3rem;"></i>

            <p class="card-text text-muted">Test je geheugen, samen met anderen live</p>
