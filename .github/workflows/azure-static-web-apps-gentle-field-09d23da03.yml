name: Azure Static Web Apps CI/CD

# Fast pipeline, see docs/deployment.md.
# - Site: Vite + TypeScript, built in a few seconds; node_modules are cached by lockfile.
# - API: rebuilt only when api/ changes (cache key = hash of api/).
# - Highscores Function App: deployed only when api/ changed in the push.
# - Type checks and unit tests run in a parallel job that does not delay deployment.
# - Documentation-only pushes do not deploy.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore build caches and redeploy everything (including the Highscores Function App)"
        type: boolean
        default: false

# One deployment per branch at a time; a newer pending run replaces an older pending one.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      # Keys are computed before anything is built, so build output never affects them.
      - name: Compute cache keys
        id: keys
        run: |
          echo "modules=site-modules-v1-node22-${{ hashFiles('app/package-lock.json') }}" >> "$GITHUB_OUTPUT"
          echo "api=swa-api-v1-node22-${{ hashFiles('api/**', '!api/node_modules/**', '!api/dist/**') }}" >> "$GITHUB_OUTPUT"

      # ---------- Site ----------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc

      - name: Restore node_modules
        id: modules
        if: inputs.full != true
        uses: actions/cache/restore@v4
        with:
          path: app/node_modules
          key: ${{ steps.keys.outputs.modules }}

      - name: Install site dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/node_modules
          key: ${{ steps.keys.outputs.modules }}

      - name: Build site
        working-directory: app
        # vite build, then the commit is stamped into every page's footer.
        run: npm run build

      # ---------- API (Static Web Apps managed functions: SignalR negotiate/messages) ----------
      - name: Restore built API
        id: api
        if: inputs.full != true
        uses: actions/cache/restore@v4
        with:
          path: api-build
          key: ${{ steps.keys.outputs.api }}

      - name: Build API
        if: steps.api.outputs.cache-hit != 'true'
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm prune --omit=dev --no-audit --no-fund
          mkdir -p ../api-build
          cp -R host.json package.json package-lock.json dist node_modules ../api-build/

      - name: Save built API
        if: steps.api.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: api-build
          key: ${{ steps.keys.outputs.api }}

      - name: Summarize build
        run: |
          {
            echo "### Incremental build"
            echo "- Site dependencies: ${{ steps.modules.outputs.cache-hit == 'true' && 'reused from cache' || 'installed' }}"
            echo "- API: ${{ steps.api.outputs.cache-hit == 'true' && 'reused from cache' || 'rebuilt' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- Deploy prebuilt output ----------
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_FIELD_09D23DA03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "app/dist"
          api_location: "api-build"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  # Type checks and unit tests; runs next to the deployment, not before it.
  checks:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Type check and unit tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v4
        with:
          path: app/node_modules
          key: site-modules-v1-node22-${{ hashFiles('app/package-lock.json') }}
      - name: Install site dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: app
        run: npm run typecheck
      - name: Unit tests
        working-directory: app
        run: npm test

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_FIELD_09D23DA03 }}
          action: "close"

  # Decides whether the separate Highscores Function App needs a deployment.
  changes:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Detect API changes
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with the previous push
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            api=${{ inputs.full == true }}
          elif [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            api=true   # unknown previous state (new branch or force push): deploy to be safe
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- api; then
            api=false
          else
            api=true
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "Highscores Function App deployment needed: $api"

  deploy_highscores_api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    name: Deploy Highscores API
    environment: carlintveld
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Build API
        working-directory: api
        run: npm ci && npm run build
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-gameengine-highscores
          package: api
